# Showcase fork only (never part of an upstream pull request).
# Dogfood (first-try start track, ADR-0266): the pre-build step renders templates with Python requests; the runtime
# image now carries a second toolchain, so the install calls pip and python directly, with no bootstrap or wrapper.
version: 1
app:
  install: >-
    npm ci &&
    pip install -q requests &&
    CI= bash .ci_scripts/update_docs pre-build-only
  start: npx docusaurus start --port {port} --host 0.0.0.0 --no-open
  url: http://localhost:{port}
  readyPath: /docs/how-to/advanced/
  readyStatus: 200
  runtime: node24
  env:
    NODE_ENV: development
demo:
  maxVideos: 1
  beforePass: true
